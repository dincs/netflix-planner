<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Rental Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            min-height: 330px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            margin-top: 10px;
        }

        .summary {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }

        .total {
            font-weight: bold;
            border-top: 1px solid #ddd;
            margin-top: 5px;
            padding-top: 10px;
        }

        button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .generate {
            background: #222;
            color: white;
        }

        .copy {
            background: #25D366;
            color: white;
        }

        .copied {
            background: #128C7E !important;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏠 Room Rental Calculator</h2>

    <label for="roomType">Room Type</label>
    <input
        type="text"
        id="roomType"
        placeholder="e.g. Small Room Non Sharing"
        oninput="generateText()"
    >

    <label for="monthlyRent">Monthly Rent (RM)</label>
    <input
        type="number"
        id="monthlyRent"
        placeholder="e.g. 500"
        min="0"
        step="1"
        oninput="generateText()"
    >

    <div class="summary">
        <div class="summary-row">
            <span>Monthly Rent</span>
            <strong id="rentDisplay">RM0</strong>
        </div>

        <div class="summary-row">
            <span>Utility Deposit (½ month)</span>
            <strong id="utilityDisplay">RM0</strong>
        </div>

        <div class="summary-row total">
            <span>Refundable Deposit</span>
            <strong id="depositDisplay">RM0</strong>
        </div>

        <div class="summary-row total">
            <span>Move-in Payment</span>
            <strong id="moveInDisplay">RM0</strong>
        </div>
    </div>

    <button class="generate" onclick="generateText()">
        Generate Text
    </button>

    <label for="output">Generated Text</label>
    <textarea id="output" readonly></textarea>

    <button class="copy" id="copyBtn" onclick="copyText()">
        📋 Copy to Clipboard
    </button>

</div>

<script>

function formatRM(amount) {
    return "RM" + Number(amount).toLocaleString("en-MY", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

function generateText() {

    const roomType = document.getElementById("roomType").value.trim();
    const rentInput = document.getElementById("monthlyRent").value;

    const rent = parseFloat(rentInput) || 0;

    // Calculations
    const utilityDeposit = rent / 2;
    const refundableDeposit = rent + utilityDeposit;
    const moveInPayment = rent + 48;

    // Update summary
    document.getElementById("rentDisplay").textContent =
        formatRM(rent);

    document.getElementById("utilityDisplay").textContent =
        formatRM(utilityDeposit);

    document.getElementById("depositDisplay").textContent =
        formatRM(refundableDeposit);

    document.getElementById("moveInDisplay").textContent =
        formatRM(moveInPayment);

    // Generate message
    const text =
`* [${roomType || "RoomType"}] room non sharing Wangsamas = ${formatRM(rent)} monthly(after discount)

❇️ Deposit small room non sharing : 
1 month ${formatRM(rent)} + 1/2month for depo utilities ${formatRM(utilityDeposit)} = ${formatRM(refundableDeposit)}(*Refundable)

❇️ Berminat boleh bayar  deposit dulu (amount  as above) selepas viewing or dah confirm mmg nk book.

❇️ Bila berpindah nak masuk( done byr full deposit) pembayarannya: 1st rental ${formatRM(rent)} + IWK RM48  (indah water lumpsum dlm setahun) = ${formatRM(moveInPayment)}

- Atas amount exclude carpark rental
* Bil api dan air sharing asing iaitu dgn tenant lain byr setiap bulan

❇️Next rental onward only ${formatRM(rent)} monthly`;

    document.getElementById("output").value = text;
}

async function copyText() {

    const output = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");

    try {

        await navigator.clipboard.writeText(output.value);

        copyBtn.textContent = "✅ Copied!";
        copyBtn.classList.add("copied");

        setTimeout(() => {
            copyBtn.textContent = "📋 Copy to Clipboard";
            copyBtn.classList.remove("copied");
        }, 1500);

    } catch (error) {

        output.select();
        document.execCommand("copy");

        copyBtn.textContent = "✅ Copied!";

        setTimeout(() => {
            copyBtn.textContent = "📋 Copy to Clipboard";
        }, 1500);
    }
}

// Generate initial text
generateText();

</script>

</body>
</html>
