<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Rental Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            background: white;
        }

        .summary {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .summary div {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }

        .summary .total {
            border-top: 1px solid #ddd;
            margin-top: 5px;
            padding-top: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 400px;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy {
            background: #25D366;
            color: white;
        }

        .copy.success {
            background: #128C7E;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏠 Room Rental Generator</h2>

    <!-- ROOM TYPE -->
    <label for="roomType">Room Type</label>

    <select id="roomType" onchange="generateText()">
        <option value="Small">Small</option>
        <option value="Medium">Medium</option>
        <option value="Master">Master</option>
    </select>


    <!-- SHARE TYPE -->
    <label for="shareType">Share Type</label>

    <select id="shareType" onchange="generateText()">
        <option value="sharing">Sharing</option>
        <option value="non sharing">Non Sharing</option>
    </select>


    <!-- CONDOMINIUM -->
    <label for="condominium">Condominium</label>

    <select id="condominium" onchange="generateText()">
        <option value="WangsaMas">WangsaMas</option>
        <option value="Hamilton">Hamilton</option>
    </select>


    <!-- MONTHLY RENT -->
    <label for="monthlyRent">Monthly Rent (RM)</label>

    <input
        type="number"
        id="monthlyRent"
        placeholder="e.g. 495"
        min="0"
        step="0.01"
        oninput="generateText()"
    >


    <!-- SUMMARY -->
    <div class="summary">

        <div>
            <span>Room</span>
            <strong id="roomDisplay">Small sharing WangsaMas</strong>
        </div>

        <div>
            <span>Monthly Rent</span>
            <strong id="rentDisplay">RM0</strong>
        </div>

        <div>
            <span>Utility Deposit (½ month)</span>
            <strong id="utilityDisplay">RM0</strong>
        </div>

        <div class="total">
            <span>Refundable Deposit</span>
            <strong id="depositDisplay">RM0</strong>
        </div>

        <div class="total">
            <span>Move-in Payment</span>
            <strong id="moveInDisplay">RM0</strong>
        </div>

    </div>


    <!-- GENERATED TEXT -->
    <label for="output">Generated Text</label>

    <textarea id="output" readonly></textarea>


    <!-- COPY -->
    <button
        class="copy"
        id="copyBtn"
        onclick="copyText()">
        📋 Copy Text
    </button>

</div>


<script>

function formatRM(amount) {

    return "RM" + Number(amount).toLocaleString("en-MY", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });

}


function generateText() {

    // Get values

    const roomType =
        document.getElementById("roomType").value;

    const shareType =
        document.getElementById("shareType").value;

    const condominium =
        document.getElementById("condominium").value;

    const rent =
        parseFloat(
            document.getElementById("monthlyRent").value
        ) || 0;


    // Room description

    const roomDescription =
        `${roomType} room ${shareType} ${condominium}`;


    // Calculations

    const utilityDeposit =
        rent / 2;

    const refundableDeposit =
        rent + utilityDeposit;

    const moveInPayment =
        rent + 48;


    // Update summary

    document.getElementById("roomDisplay").textContent =
        roomDescription;

    document.getElementById("rentDisplay").textContent =
        formatRM(rent);

    document.getElementById("utilityDisplay").textContent =
        formatRM(utilityDeposit);

    document.getElementById("depositDisplay").textContent =
        formatRM(refundableDeposit);

    document.getElementById("moveInDisplay").textContent =
        formatRM(moveInPayment);


    // Generate WhatsApp text

    const text =
`* ${roomDescription} = ${formatRM(rent)} monthly(after discount)

❇️ *Deposit small room non sharing :* 
1 month ${formatRM(rent)}+1/2month for depo utilities ${formatRM(utilityDeposit)}=${formatRM(refundableDeposit)}(*Refundable)

❇️ *Berminat boleh bayar  deposit dulu* (amount  as above) selepas viewing or dah confirm mmg nk book.

 *❇️ Bila berpindah nak masuk( done byr full deposit) pembayarannya: 1st rental ${formatRM(rent)} + IWK RM48  (indah water lumpsum dlm setahun) = ${formatRM(moveInPayment)}* 

- Atas amount exclude carpark rental
* Bil api dan air sharing asing iaitu dgn tenant lain byr setiap bulan

❇️Next rental onward only ${formatRM(rent)} monthly`;


    document.getElementById("output").value =
        text;

}


async function copyText() {

    const output =
        document.getElementById("output");

    const button =
        document.getElementById("copyBtn");


    try {

        await navigator.clipboard.writeText(
            output.value
        );

        button.textContent =
            "✅ Copied!";

        button.classList.add("success");


        setTimeout(() => {

            button.textContent =
                "📋 Copy Text";

            button.classList.remove("success");

        }, 1500);


    } catch (error) {

        output.select();

        document.execCommand("copy");

        button.textContent =
            "✅ Copied!";


        setTimeout(() => {

            button.textContent =
                "📋 Copy Text";

        }, 1500);

    }

}


// Generate initial text

generateText();

</script>

</body>
</html>
